name: Aggiornamento Comunicati Giudice Sportivo FIGC CRER

on:
  schedule:
    # Esegue ogni Giovedi alle 16:00 UTC (17:00 / 18:00 ora italiana) dopo la pubblicazione settimanale dei CU
    - cron: '0 16 * * 4'
    # Esegue anche il Venerdi alle 09:00 UTC di controllo
    - cron: '0 9 * * 5'
  workflow_dispatch: # Consente di avviare l'aggiornamento manuale del Giudice Sportivo con 1 clic

jobs:
  scrape-giudice-sportivo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 4. Installa dipendenze Python
        run: |
          pip install -r requirements.txt

      - name: 5. Installa dipendenze Node.js
        run: |
          npm ci

      - name: 6. Esegui Scraping Comunicati Giudice Sportivo & Sincronizzazione
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI: 'true'
        run: |
          python scripts/scraper_giudice_sportivo.py --reverse --max-pages 5 --sync-app

      - name: 7. Commit & Push su GitHub (Trigger Deploy Vercel)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ src/data/ public/comunicati/ Eccellenza_Emilia_Romagna_Database_Completo.xlsx
          if git diff --staged --quiet; then
            echo "Nessuna nuova sanzione o comunicato da salvare."
          else
            git commit -m "chore(giudice): aggiornamento comunicati ufficiali e provvedimenti disciplinari"
            git push origin main
          fi

